<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual SPEPM | Viajes Estudiantiles</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden; /* 👈 permite que el chat flotante se vea */
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
        }

        .bounce-arrow {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>

<body class="flex items-center justify-center relative">

    <main class="glass-card rounded-3xl p-8 md:p-12 max-w-2xl w-full mx-4 text-center relative z-10 transition-all duration-300 hover:shadow-2xl">

        <div class="mb-6">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-indigo-600 text-white shadow-lg mb-4">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
            </div>

            <h2 class="text-sm font-bold tracking-widest text-indigo-600 uppercase mb-2">
                Servicio Provincial de Enseñanza Privada de Misiones
            </h2>

            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-2">
                Viajes Estudiantiles
            </h1>
        </div>

        <p class="text-lg text-gray-600 mb-8">
            Bienvenido al canal oficial de consultas automáticas. Resuelvo tus dudas sobre la
            <span class="font-bold text-indigo-600">normativa vigente</span>, plazos y requisitos del
            <span class="font-bold">Decreto 2704/24</span>.
        </p>

        <div class="flex flex-col items-center mt-10 opacity-80">
            <p class="text-sm font-semibold text-gray-500 uppercase">Comienza aquí</p>
            <i class="fa-solid fa-arrow-turn-down fa-flip-horizontal text-3xl text-indigo-500 bounce-arrow translate-x-12"></i>
        </div>

        <div class="mt-12 text-xs text-gray-400 border-t pt-4">
            &copy; 2025 SPEPM – Misiones · Tecnología Voiceflow
        </div>
    </main>

    <!-- ✅ CHATBOT VOICEFLOW (CORREGIDO) -->
    <script type="module">
        (function (d, t) {
            const v = d.createElement(t);
            const s = d.getElementsByTagName(t)[0];

            v.onload = function () {
                window.voiceflow.chat.load({
                    verify: { projectID: '6966b2ff2534d547bd0068c5' },
                    url: 'https://general-runtime.voiceflow.com',
                    versionID: 'production'
                });
            };

            v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs";
            s.parentNode.insertBefore(v, s);
        })(document, 'script');
    </script>

</body>
</html>
